# L'exécutable unique, construit pour chaque système par GitHub — celui du
# superviseur, et celui du témoin de lien Ethernet (`temoin-ethernet-*`), deux
# fichiers par système, construits et vérifiés dans le même job.
#
# PyInstaller ne compile pas en croisé : un fichier par système, construit sur
# ce système. Ici, trois machines de GitHub s'en chargent — Windows, macOS à
# puce Apple, macOS Intel — et déposent les fichiers en téléchargement :
#
#   - à chaque exécution manuelle (onglet Actions › « Exécutable » › Run
#     workflow), en « artefacts » du run, gardés quatorze jours — avec le
#     choix du produit : les deux, le superviseur seul, ou le témoin seul ;
#   - à chaque étiquette `v*` poussée (`git tag v1.0.0 && git push --tags`),
#     en fichiers d'une Release du dépôt, pour de bon — toujours les deux
#     produits : une Release ne sort jamais à moitié.
#
# Aucun fichier n'est produit tant que les suites de tests ne sont pas vertes,
# et chaque exécutable est LANCÉ après construction : serveur, interface, base à
# côté — la vérification qui a manqué au premier essai du 19 septembre.
#
# Avant toute construction, le job `garde` vérifie les numéros de version
# (secondes, sur une machine Linux, sans rien installer) ; en parallèle, le job
# `audits` cherche les failles connues des dépendances d'exécution. Une Release
# attend les deux. Elle porte aussi `LICENCES-TIERCES.txt`, les mentions des
# composants tiers que les exécutables embarquent (chacun en a aussi sa copie,
# servie sous /LICENCES-TIERCES.txt), et `SHA256SUMS`, les empreintes des sept
# fichiers.
#
# Les fichiers ne sont pas signés : un avertissement au premier lancement
# (Gatekeeper, SmartScreen), qui se lève sans droits d'administrateur.
#
# Chaque action est épinglée par l'empreinte complète de son commit, la
# majeure qu'elle représente en commentaire (`# v7`, ou `# v7.1.0` une fois
# que Dependabot l'a montée — .github/dependabot.yml, chaque mois) : une
# étiquette se déplace, une empreinte non. Empreintes relevées le 24/10/2026 par l'API
# publique de GitHub (`git/ref/tags/vN`, étiquette annotée déréférencée
# jusqu'au commit). Pour monter de version : relever la nouvelle empreinte
# de la même façon, changer l'empreinte ET le commentaire — tests/test_ci.py
# lit la majeure dans le commentaire. Les dépendances Python sont épinglées à
# l'identique (`==`, backend/requirements*.txt), celles de l'interface par
# package-lock.json (`npm ci`) : la construction ne prend plus « les versions
# du jour ».

name: Exécutable

on:
  workflow_dispatch:
    inputs:
      produit:
        description: "Que construire"
        type: choice
        options: [les deux, superviseur, témoin]
        default: les deux
  push:
    tags: ["v*"]

# Lecture par défaut ; seul `publier` écrit. Posé ici, `contents: write`
# armait aussi les jobs de construction, pendant `npm ci` et `pip install`
# — alors des dépendances en `>=` (C-48).
permissions:
  contents: read

jobs:
  # La garde de version, d'abord : une étiquette sans section de CHANGELOG, ou
  # des numéros qui divergent, arrêtent tout ici — et non après vingt minutes
  # de trois constructions. Sur une étiquette `v*` (la condition même de
  # `publier`), la garde complète ; sans étiquette (lancement manuel depuis une
  # branche), la cohérence seule : les trois numéros du code concordent, le
  # CHANGELOG n'est pas lu — l'« À venir » n'a pas de numéro, un exécutable de
  # test pas de Release. Bibliothèque standard seule : rien à installer.
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Garde de version — avant toute construction
        env:
          ETIQUETTE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$ETIQUETTE" ]; then
            python3 .github/scripts/garde_version.py "$ETIQUETTE"
          else
            python3 .github/scripts/garde_version.py --coherence
          fi

  # Les failles connues des dépendances d'EXÉCUTION — ce que l'exécutable
  # embarque (backend/requirements.txt), ce que le navigateur charge (les
  # `dependencies` du verrou npm). Une faille de gravité haute ou critique côté
  # interface, toute faille connue côté serveur, font échouer le run, donc
  # bloquent la Release ; les outils de développement ne sont pas audités. En
  # parallèle des constructions : un audit qui échoue ne retient pas un
  # exécutable de test, il retient la publication. `--no-deps` : tout est
  # épinglé à l'identique, pip-audit lit les versions telles quelles au lieu de
  # résoudre un environnement (les dépendances propres à un système, non
  # épinglées — pywin32-ctypes de keyring —, échappent donc à l'audit).
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-audit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      # Par `auditer.py` : une panne réseau est retentée une fois, puis dite
      # « erreur réseau » — et non « failles connues », qui seules sont dites
      # comme telles.
      - name: Serveur — failles connues (pip-audit)
        run: |
          python -m pip install -r backend/requirements-audit.txt
          python .github/scripts/auditer.py -- python -m pip_audit --no-deps --progress-spinner off -r backend/requirements.txt
      # Le verrou suffit : `npm audit` n'a pas besoin de node_modules.
      - name: Interface — failles connues (npm audit)
        working-directory: frontend
        run: python ../.github/scripts/auditer.py -- npm audit --omit=dev --audit-level=high

  construire:
    needs: garde
    strategy:
      fail-fast: false
      matrix:
        include:
          # `licences` : cette machine seule envoie LICENCES-TIERCES.txt à la
          # Release — une fois, et non une par système. Celui du superviseur
          # Windows couvre les deux autres (même requirements.txt, même verrou
          # npm ; pywin32-ctypes de keyring en plus) et le témoin (son serveur).
          - os: windows-latest
            licences: true
            nom: superviseur-windows-x64.exe
            produit: dist/superviseur.exe
            livraison: superviseur-windows-x64.exe
            temoin_nom: temoin-ethernet-windows-x64.exe
            temoin_produit: dist/temoin-ethernet.exe
            temoin_livraison: temoin-ethernet-windows-x64.exe
          # La couverture des tests, sur cette machine seule (la plus rapide) :
          # affichée dans le journal et le résumé du run, sans seuil.
          - os: macos-latest
            couverture: true
            nom: superviseur-macos-arm64
            produit: dist/superviseur
            livraison: superviseur-macos-arm64.tar.gz
            temoin_nom: temoin-ethernet-macos-arm64
            temoin_produit: dist/temoin-ethernet
            temoin_livraison: temoin-ethernet-macos-arm64.tar.gz
          # Le Mac de terrain est un Intel (i7, macOS 13) : le fichier arm64 n'y
          # tourne pas. GitHub retire ses machines Intel par étapes ; si cette
          # étiquette disparaît, prendre celle qu'il propose alors — ou construire
          # sur le Mac lui-même avec tools/construire_executable.py.
          - os: macos-15-intel
            nom: superviseur-macos-x64
            produit: dist/superviseur
            livraison: superviseur-macos-x64.tar.gz
            temoin_nom: temoin-ethernet-macos-x64
            temoin_produit: dist/temoin-ethernet
            temoin_livraison: temoin-ethernet-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    # Sur une étiquette, `inputs.produit` est vide : les deux produits.
    env:
      SUPERVISEUR: ${{ inputs.produit != 'témoin' }}
      TEMOIN: ${{ inputs.produit != 'superviseur' }}
    defaults:
      run:
        shell: bash
    steps:
      # Le jeton n'est pas gardé dans .git/config pendant les installations.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node 24, comme la machine qui a produit package-lock.json : son npm 11
      # tient pour cohérent un verrou que le npm 10 de Node 22 refuse
      # (« Missing: esbuild@0.28.2 from lock file » — premier run, 19 septembre),
      # alors que `npm ci` passe en local depuis une copie vierge.
      # L'interface compilée ne sert que le superviseur : le témoin a un
      # écran statique.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.SUPERVISEUR == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
            backend/requirements-build.txt

      - name: Interface — dépendances, types, tests, compilation
        if: env.SUPERVISEUR == 'true'
        working-directory: frontend
        run: |
          node --version && npm --version
          npm ci
          npx tsc --noEmit -p .
          if [ "${{ matrix.couverture }}" = true ]; then
            npx vitest run --coverage.enabled --coverage.include='src/**' \
              --coverage.reporter=text-summary --coverage.reporter=json-summary
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const l = ["### Couverture — interface", "", "| | % |", "|---|---|"];
              for (const k of ["lines", "statements", "branches", "functions"])
                l.push(`| ${k} | ${t[k].pct} |`);
              console.log(l.join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            npm test
          fi
          npm run build

      # Windows ouvre les fichiers et parle à sa console en cp1252 : les
      # journaux du deuxième run étaient illisibles (« r�seau »). UTF-8 pour
      # les tests et la construction — mais PAS pour l'étape qui lance
      # l'exécutable : elle doit le voir comme le terrain le verra, sans
      # variable d'environnement qui n'y sera pas.
      - name: Serveur — dépendances, lint, tests
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          # Tests et construction, rien d'autre : pip-audit est au job d'audit.
          python -m pip install -r requirements-test.txt -r requirements-build.txt
          python -m ruff check .
          if [ "${{ matrix.couverture }}" = true ]; then
            python -m pytest -q --junitxml=rapport-pytest.xml \
              --cov=app --cov=temoin --cov-report=term:skip-covered
            { printf '### Couverture — serveur\n\n'
              python -m coverage report --format=markdown --skip-covered; } >> "$GITHUB_STEP_SUMMARY"
          else
            python -m pytest -q --junitxml=rapport-pytest.xml
          fi

      # Chaque échec de test devient une annotation : les journaux complets ne
      # sont pas toujours lisibles d'où l'on relit un run, les annotations si.
      - name: Serveur — échecs en annotations
        if: failure()
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          rapport = Path("rapport-pytest.xml")
          if rapport.exists():
              for cas in ET.parse(rapport).iter("testcase"):
                  for echec in list(cas.iter("failure")) + list(cas.iter("error")):
                      texte = (echec.get("message") or "").replace("\n", " ")[:900]
                      print(f"::error title={cas.get('classname')}.{cas.get('name')}::{texte}")
          PY

      - name: Construire l'exécutable
        if: env.SUPERVISEUR == 'true'
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: python tools/construire_executable.py

      - name: Le lancer, et vérifier qu'il répond — serveur, interface, base
        if: env.SUPERVISEUR == 'true'
        working-directory: backend
        run: python tools/verifier_executable.py ${{ matrix.produit }}

      # Le témoin de lien Ethernet : son écran est statique, rien à compiler
      # côté interface ; sa santé se lit sur /api/sante, sa base est temoin.db.
      - name: Construire le témoin Ethernet
        if: env.TEMOIN == 'true'
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: python tools/construire_executable.py --produit temoin

      - name: Lancer le témoin, et vérifier qu'il répond — serveur, écran, base
        if: env.TEMOIN == 'true'
        working-directory: backend
        # Sous Windows, le bash de Git convertit tout argument qui ressemble à
        # un chemin absolu : `/api/sante` arrivait en
        # `C:/Program Files/Git/api/sante` (run #19).
        env:
          MSYS_NO_PATHCONV: "1"
        run: python tools/verifier_executable.py ${{ matrix.temoin_produit }} --sante /api/sante

      # Sur macOS, une archive tar.gz et non le fichier nu : l'emballage des
      # artefacts et des Releases perd les permissions Unix, et le fichier
      # arrivait sans droit d'exécution — « le build mac ne fonctionne pas »,
      # vérifié sur un Mac Intel le 19 septembre : `-rw-r--r--`, et il
      # tournait dès `chmod +x`. Un tar.gz conserve le droit ; Finder le
      # décompresse d'un double-clic. Windows n'a pas de bit d'exécution.
      - name: Nommer, et emballer pour livrer le droit d'exécution
        working-directory: backend
        run: |
          if [ "$SUPERVISEUR" = true ]; then
            mv "${{ matrix.produit }}" "dist/${{ matrix.nom }}"
            case "${{ matrix.livraison }}" in
              *.tar.gz) tar -czf "dist/${{ matrix.livraison }}" -C dist "${{ matrix.nom }}" ;;
            esac
          fi
          if [ "$TEMOIN" = true ]; then
            mv "${{ matrix.temoin_produit }}" "dist/${{ matrix.temoin_nom }}"
            case "${{ matrix.temoin_livraison }}" in
              *.tar.gz) tar -czf "dist/${{ matrix.temoin_livraison }}" -C dist "${{ matrix.temoin_nom }}" ;;
            esac
          fi
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.SUPERVISEUR == 'true'
        with:
          name: ${{ matrix.livraison }}
          path: backend/dist/${{ matrix.livraison }}
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.TEMOIN == 'true'
        with:
          name: ${{ matrix.temoin_livraison }}
          path: backend/dist/${{ matrix.temoin_livraison }}
          retention-days: 14
          if-no-files-found: error

      # Écrit par la construction du superviseur (tools/licences_tierces.py),
      # à côté de l'exécutable ; sa copie embarquée a été lue par la
      # vérification.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.licences && env.SUPERVISEUR == 'true'
        with:
          name: LICENCES-TIERCES.txt
          path: backend/dist/LICENCES-TIERCES.txt
          retention-days: 14
          if-no-files-found: error

  publier:
    # Seulement sur une étiquette : les fichiers rejoignent une Release, dont
    # le texte est la section de CHANGELOG.md qui porte cette étiquette —
    # écrite à la main, au moment où l'on sait ce que la version change,
    # versionnée avec le code, et indépendante de la façon dont l'étiquette a
    # été posée (annotée, légère, ou créée depuis le site).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [construire, audits]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Avant tout envoi : l'étiquette (sans « v »), la section du CHANGELOG
      # qui la porte — la première numérotée, « ## À venir » au-dessus permise
      # —, les deux paquets Python et package.json doivent dire le même
      # numéro. Sinon le job échoue ici, et rien n'est publié : plus de texte
      # de secours pour une étiquette sans section.
      - name: Garde de version — la section de CHANGELOG.md devient le texte de la Release
        run: |
          python3 .github/scripts/garde_version.py "${GITHUB_REF_NAME}" > notes.md
          cat notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: fichiers
          merge-multiple: true
      # Les empreintes des sept fichiers — six exécutables et
      # LICENCES-TIERCES.txt, publié avec eux et couvert comme eux —, au format
      # de `sha256sum` (`<hex>  <nom>`) : `shasum -a 256 -c SHA256SUMS` sur
      # Mac, `Get-FileHash` sous Windows. Sept fichiers, ni plus ni moins : un
      # produit manquant arrête la publication ici.
      - name: Empreintes SHA-256 — SHA256SUMS
        working-directory: fichiers
        run: |
          set -- *
          test "$#" -eq 7
          sha256sum -- "$@" > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Superviseur et témoin Ethernet ${{ github.ref_name }}
          body_path: notes.md
          files: fichiers/*
